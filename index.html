<label>Usuario<input type="text" id="lgU" autocomplete="username" required></label>

<label class="lgchk"><input type="checkbox" id="lgR" checked> Recordarme en este equipo</label>

    <div><b id="brandN">PSFV-OBE II</b><small id="brandS">Gestión de obra</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">

  </div>
</aside>

    <div id="vActions"></div>
  </header>
  <section id="view"></section>
